<!DOCTYPE html>
<html>
<head>
    <title>Análisis Musical: Cat O' Nine Tails, John Zorn. Por Nicolás López.</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        #mynetwork { width: 100%; height: 85vh; border: 1px solid #ccc; background-color: white; }
        .controls { margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Explorador de Ontología Musical: Catoninetails</h2>
    
    <div class="controls">
        <label>Filtrar por Dimensión: </label>
        <select id="dimensionFilter">
            <option value="all">Mostrar Todo</option>
        </select>
        <small style="margin-left: 20px;">Usa el scroll para Zoom | Arrastra para mover</small>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        let network = null;
        let allNodes = null;
        let allEdges = null;
        let nodesView = null;

fetch('catoninetails-graph3.json')
            .then(res => res.json())
            .then(data => {
                
                const processedNodes = data.nodes.map(n => {
                    const attrs = n.attributes; 
                    return {
                        id: n.key,
                        label: attrs.label || n.key,
                        x: Number(attrs.x), 
                        // CORRECCIÓN EJE Y: Invertimos el signo para que coincida con Gephi
                        y: Number(attrs.y) * -1, 
                        color: attrs.color || '#97C2FC',
                        size: attrs.size ? attrs.size : 10,
                        // Forzamos minúsculas para evitar errores de matching
                        dimension: attrs.dimension ? attrs.dimension.toLowerCase() : 'sin dimensión',
                        nivel: attrs.nivel ? attrs.nivel.toLowerCase() : ''
                    };
                });

                const processedEdges = data.edges.map(e => ({
                    id: e.key,
                    from: e.source,
                    to: e.target,
                    color: { color: '#848484', opacity: 0.3 }
                }));

                // Llenar el selector con valores únicos y limpios
                const dimensions = [...new Set(processedNodes.map(n => n.dimension).filter(d => d && d !== 'sin dimensión'))];
                const select = document.getElementById('dimensionFilter');
                
                // Limpiamos el select por si acaso
                select.innerHTML = '<option value="all">Mostrar Todo</option>';
                
                dimensions.sort().forEach(dim => {
                    const opt = document.createElement('option');
                    opt.value = dim;
                    opt.innerHTML = dim.toUpperCase(); // Lo mostramos en mayúsculas para estética
                    select.appendChild(opt);
                });

                allNodes = new vis.DataSet(processedNodes);
                allEdges = new vis.DataSet(processedEdges);
                nodesView = new vis.DataView(allNodes);

                const container = document.getElementById('mynetwork');
                const visData = { nodes: nodesView, edges: allEdges };

                const options = {
                    nodes: {
                        shape: 'dot',
                        font: { size: 14, strokeWidth: 4, strokeColor: '#ffffff' }
                    },
                    edges: {
                        arrows: { to: { enabled: true, scaleFactor: 0.4 } },
                        smooth: { type: 'continuous' } 
                    },
                    physics: { enabled: false },
                    interaction: { hover: true, navigationButtons: true }
                };

                network = new vis.Network(container, visData, options);

                // FILTRO CORREGIDO
                select.addEventListener('change', (e) => {
                    const val = e.target.value.toLowerCase();
                    
                    if (val === 'all') {
                        nodesView.setFilter(null);
                    } else {
                        nodesView.setFilter((node) => {
                            // REGLA: Mostrar si el nodo pertenece a la dimensión
                            // O si el nodo es de nivel "frase" (para ver la relación)
                            // O si es el nodo principal de la dimensión (el nodo "padre")
                            return node.dimension === val || node.nivel === 'frase';
                        });
                    }
                });
            });
        
            .catch(err => {
                console.error("Error completo:", err);
                document.getElementById('mynetwork').innerHTML = "Error: " + err.message;
            });
    </script>
</body>
</html>
