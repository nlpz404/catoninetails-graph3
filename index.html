<!DOCTYPE html>
<html>
<head>
    <title>Análisis Musical: Red Zorn</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        #mynetwork { width: 100%; height: 85vh; border: 1px solid #ccc; background-color: white; }
        .controls { margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Explorador de Ontología Musical: Catoninetails</h2>
    
    <div class="controls">
        <label>Filtrar por Dimensión: </label>
        <select id="dimensionFilter">
            <option value="all">Mostrar Todo</option>
        </select>
        <small style="margin-left: 20px;">Usa el scroll para Zoom | Arrastra para mover</small>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        var network = null;
        var allNodes = null;
        var allEdges = null;
        var nodesView = null;

        // Cargamos el archivo JSON
        fetch('catoninetails-graph3.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                
                // 1. PROCESAR NODOS
                var processedNodes = data.nodes.map(function(n) {
                    var a = n.attributes || {}; // Acceso seguro a atributos
                    
                    return {
                        id: n.key, // Gephi usa 'key', Vis.js necesita 'id'
                        label: a.label || n.key,
                        x: Number(a.x) || 0,
                        // INVERSIÓN EJE Y: Para que no salga cabeza abajo
                        y: (Number(a.y) || 0) * -1,
                        color: a.color || '#97C2FC',
                        size: Number(a.size) || 10,
                        // Guardamos metadata para el filtro
                        dimension: a.dimension ? String(a.dimension).toLowerCase() : 'sin dimensión',
                        nivel: a.nivel ? String(a.nivel).toLowerCase() : ''
                    };
                });

                // 2. PROCESAR ARISTAS (EDGES) - Sin color fijo para permitir herencia
                var processedEdges = data.edges.map(function(e) {
                    return {
                        id: e.key,
                        from: e.source, 
                        to: e.target,
                        // No definimos color aquí para que lo tome de las opciones globales
                        // o lo herede de los nodos.
                    };
                });

                // 3. LLENAR EL FILTRO DE DIMENSIONES
                var select = document.getElementById('dimensionFilter');
                var uniqueDims = {};
                processedNodes.forEach(function(n) {
                    if (n.dimension && n.dimension !== 'sin dimensión' && n.nivel !== 'frase') {
                        uniqueDims[n.dimension] = true;
                    }
                });

                Object.keys(uniqueDims).sort().forEach(function(dim) {
                    var opt = document.createElement('option');
                    opt.value = dim;
                    opt.innerHTML = dim.toUpperCase();
                    select.appendChild(opt);
                });

                // 4. CONFIGURAR LA RED CON FILTRO DINÁMICO
                allNodes = new vis.DataSet(processedNodes);
                allEdges = new vis.DataSet(processedEdges);
                
                // Variable global para guardar el filtro actual
                var filtroActual = 'all';

                // Inicializamos el DataView con la lógica de filtrado
                nodesView = new vis.DataView(allNodes, {
                    filter: function (node) {
                        if (filtroActual === 'all') return true;
                        
                        // REGLA DE ORO: 
                        // Mostramos si coincide la dimensión 
                        // O si el nivel es exactamente "frase"
                        var matchDimension = (node.dimension === filtroActual);
                        var esFrase = (node.nivel === 'frase');
                        
                        return matchDimension || esFrase;
                    }
                });

                var container = document.getElementById('mynetwork');
                var visData = { 
                    nodes: nodesView, 
                    edges: allEdges 
                };

                var options = {
                    nodes: {
                        shape: 'dot',
                        font: { 
                            size: 14, 
                            strokeWidth: 4, 
                            strokeColor: '#ffffff' 
                        }
                    },
                    edges: {
                        width: 2, // Hace la línea más gruesa
                        color: {
                            inherit: 'from', // HERENCIA: Toma el color del nodo origen
                            opacity: 0.8      // OPACIDAD: Mucho más visible que el 0.3 anterior
                        },
                        arrows: {
                            to: { 
                                enabled: true, 
                                scaleFactor: 1.2 // Flechas más grandes y fáciles de ver
                            }
                        },
                        smooth: { 
                            type: 'continuous',
                            roundness: 0.5 
                        }
                    },
                    physics: {
                        enabled: false 
                    },
                    interaction: {
                        hover: true,
                        navigationButtons: true,
                        multiselect: true
                    }
                };

                network = new vis.Network(container, visData, options);

                // 5. LÓGICA DEL FILTRO ACTUALIZADA
                select.addEventListener('change', function(e) {
                    // Actualizamos la variable global
                    filtroActual = e.target.value.toLowerCase();
                    
                    // IMPORTANTE: Esto obliga al DataView a volver a ejecutar la función filter
                    nodesView.refresh(); 
                });

                // BONUS: Resaltar conexiones al hacer clic
                network.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        var nodeId = params.nodes[0];
                        // Aquí podrías añadir lógica para iluminar vecinos
                        console.log("Nodo seleccionado:", nodeId);
                    }
                });

            })
            .catch(function(err) {
                console.error("Error cargando el JSON:", err);
                document.getElementById('mynetwork').innerHTML = "Error: " + err.message;
            });
    </script>
</body>
</html>
