<!DOCTYPE html>
<html>
<head>
    <title>Análisis Musical: Cat O' Nine Tails, John Zorn. Por Nicolás López.</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        #mynetwork { width: 100%; height: 85vh; border: 1px solid #ccc; background-color: white; }
        .controls { margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Explorador de Ontología Musical: Catoninetails</h2>
    
    <div class="controls">
        <label>Filtrar por Dimensión: </label>
        <select id="dimensionFilter">
            <option value="all">Mostrar Todo</option>
        </select>
        <small style="margin-left: 20px;">Usa el scroll para Zoom | Arrastra para mover</small>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        let network = null;
        let allNodes = null;
        let allEdges = null;
        let nodesView = null;

        fetch('catoninetails-graph3.json')
            .then(res => res.json())
            .then(data => {
                // 1. Mapeo inteligente de datos
                // Gephi suele exportar atributos dentro de 'attributes' o en la raíz
                const processedNodes = data.nodes.map(n => {
                    return {
                        id: n.id,
                        label: n.label || n.attributes?.Label || n.id,
                        // Usamos las coordenadas de Gephi para mantener tu eje vertical
                        x: n.x || undefined,
                        y: n.y || undefined,
                        // Color: Priorizamos el color de Gephi, si no, gris
                        color: n.color || n.attributes?.color || '#97C2FC',
                        size: (n.size || n.attributes?.size || 10) * 1.5,
                        // Guardamos la dimensión para el filtro
                        dimension: n.attributes?.Dimension || 'Sin Dimensión'
                    };
                });

                // 2. Llenar el selector de dimensiones automáticamente
                const dimensions = [...new Set(processedNodes.map(n => n.dimension))];
                const select = document.getElementById('dimensionFilter');
                dimensions.forEach(dim => {
                    const opt = document.createElement('option');
                    opt.value = dim;
                    opt.innerHTML = dim;
                    select.appendChild(opt);
                });

                // 3. Configurar Vis.js
                allNodes = new vis.DataSet(processedNodes);
                allEdges = new vis.DataSet(data.edges);
                
                // NodesView nos permite filtrar sin borrar datos
                nodesView = new vis.DataView(allNodes);

                const container = document.getElementById('mynetwork');
                const visData = { nodes: nodesView, edges: allEdges };

                const options = {
                    nodes: {
                        shape: 'dot',
                        font: { size: 14, strokeWidth: 2, strokeColor: '#ffffff' }
                    },
                    edges: {
                        arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                        color: { inherit: 'from', opacity: 0.4 },
                        smooth: { type: 'continuous' } // Líneas suaves para evitar el "espagueti"
                    },
                    physics: {
                        enabled: false // IMPORTANTE: False para respetar tu diseño manual de Gephi
                    },
                    interaction: {
                        hover: true,
                        navigationButtons: true,
                        tooltipDelay: 200
                    }
                };

                network = new vis.Network(container, visData, options);

                // 4. Lógica del Filtro
                select.addEventListener('change', (e) => {
                    const val = e.target.value;
                    if (val === 'all') {
                        nodesView.setFilter(null);
                    } else {
                        nodesView.setFilter((node) => {
                            // Mostramos el nodo si es de esa dimensión O si es una "frase" 
                            // (para ver la relación entre dimensión y estructura temporal)
                            return node.dimension === val || node.dimension === '_Frase_Master';
                        });
                    }
                });
            })
            .catch(err => {
                console.error("Error cargando el JSON:", err);
                document.getElementById('mynetwork').innerHTML = "Error al cargar el archivo JSON. Revisa la consola (F12).";
            });
    </script>
</body>
</html>
