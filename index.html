<!DOCTYPE html>
<html>
<head>
    <title>Grafo de conocimiento: Cat O' Nine Tails, de John Zorn. Por Nicolás López.</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        #mynetwork { width: 100%; height: 85vh; border: 1px solid #ccc; background-color: white; }
        .controls { margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Explorador de Ontología Musical: Cat O' Nine Tails</h2>

    <div class="controls">
        <label>Filtrar por Dimensión: </label>
        <select id="dimensionFilter">
            <option value="all">Mostrar Todo</option>
        </select>
        <small style="margin-left: 20px;">Hover o Click para resaltar | Ctrl+Click para multiselección | Click en fondo para limpiar</small>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">

    fetch('catoninetails-graph3.json')
        .then(function(res) { return res.json(); })
        .then(function(data) {

            // ─── 1. DICCIONARIOS ───────────────────────────────────────────────────────
            var colorLookup = {};   // nodeId → color hex original
            var nivelLookup = {};   // nodeId → nivel string
            var edgeColorLookup = {}; // edgeId → color hex original

            // ─── 2. NODOS ──────────────────────────────────────────────────────────────
            var processedNodes = data.nodes.map(function(n) {
                var a = n.attributes || {};
                var color = a.color || '#97C2FC';
                var nivel = a.nivel ? String(a.nivel).toLowerCase() : '';

                colorLookup[n.key] = color;
                nivelLookup[n.key] = nivel;

                return {
                    id: n.key,
                    label: a.label || n.key,
                    x: Number(a.x) || 0,
                    y: (Number(a.y) || 0) * -1,
                    // Color base + anulamos highlight/hover de Vis.js con el mismo color
                    color: {
                        background: color,
                        border: color,
                        highlight: { background: color, border: color },
                        hover:      { background: color, border: color }
                    },
                    size: Number(a.size) || 10,
                    dimension: a.dimension ? String(a.dimension).toLowerCase() : 'sin dimensión',
                    nivel: nivel
                };
            });

            // ─── 3. ARISTAS ────────────────────────────────────────────────────────────
            var processedEdges = data.edges.map(function(e) {
                var nivelSource = nivelLookup[e.source];
                var nivelTarget = nivelLookup[e.target];
                var finalColor;

                if (nivelSource === 'frase' && nivelTarget !== 'frase') {
                    finalColor = colorLookup[e.target];
                } else {
                    finalColor = colorLookup[e.source];
                }
                finalColor = finalColor || '#848484';

                edgeColorLookup[e.key] = finalColor;

                return {
                    id: e.key,
                    from: e.source,
                    to: e.target,
                    color: {
                        color: hexToRgba(finalColor, 0.7),
                        highlight: hexToRgba(finalColor, 1.0),
                        hover:     hexToRgba(finalColor, 1.0),
                        inherit: false
                    },
                    arrows: { to: { enabled: true, scaleFactor: 1.2 } }
                };
            });

            // ─── 4. FILTRO DE DIMENSIONES ──────────────────────────────────────────────
            var select = document.getElementById('dimensionFilter');
            var uniqueDims = {};
            processedNodes.forEach(function(n) {
                if (n.dimension && n.dimension !== 'sin dimensión' && n.nivel !== 'frase') {
                    uniqueDims[n.dimension] = true;
                }
            });
            Object.keys(uniqueDims).sort().forEach(function(dim) {
                var opt = document.createElement('option');
                opt.value = dim;
                opt.innerHTML = dim.toUpperCase();
                select.appendChild(opt);
            });

            // ─── 5. RED ────────────────────────────────────────────────────────────────
            var allNodes = new vis.DataSet(processedNodes);
            var allEdges = new vis.DataSet(processedEdges);
            var filtroActual = 'all';

            var nodesView = new vis.DataView(allNodes, {
                filter: function(node) {
                    if (filtroActual === 'all') return true;
                    return (node.dimension === filtroActual) || (node.nivel === 'frase');
                }
            });

            var container = document.getElementById('mynetwork');
            var options = {
                nodes: {
                    shape: 'dot',
                    font: { size: 14, strokeWidth: 4, strokeColor: '#ffffff' },
                    borderWidth: 2
                },
                edges: {
                    width: 2,
                    smooth: { type: 'continuous' }
                },
                physics: { enabled: false },
                interaction: {
                    hover: true,
                    navigationButtons: true,
                    multiselect: true,
                    selectConnectedEdges: false
                }
            };

            var network = new vis.Network(container, { nodes: nodesView, edges: allEdges }, options);

            // ─── 6. LÓGICA DE RESALTADO ────────────────────────────────────────────────

            function hexToRgba(hex, opacity) {
                if (!hex || hex[0] !== '#') return 'rgba(150,150,150,' + opacity + ')';
                var r = parseInt(hex.slice(1, 3), 16),
                    g = parseInt(hex.slice(3, 5), 16),
                    b = parseInt(hex.slice(5, 7), 16);
                return 'rgba(' + r + ',' + g + ',' + b + ',' + opacity + ')';
            }

            function restaurarTodo() {
                var nodeUpdates = allNodes.get().map(function(n) {
                    var c = colorLookup[n.id] || '#97C2FC';
                    return {
                        id: n.id,
                        color: {
                            background: c,
                            border: c,
                            highlight: { background: c, border: c },
                            hover:      { background: c, border: c }
                        },
                        font: { color: '#000000' }
                    };
                });
                var edgeUpdates = allEdges.get().map(function(e) {
                    var c = edgeColorLookup[e.id] || '#848484';
                    return {
                        id: e.id,
                        color: {
                            color: hexToRgba(c, 0.7),
                            highlight: hexToRgba(c, 1.0),
                            hover:     hexToRgba(c, 1.0),
                            inherit: false
                        }
                    };
                });
                allNodes.update(nodeUpdates);
                allEdges.update(edgeUpdates);
            }

            function resaltar(nodosSeleccionados) {
                if (!nodosSeleccionados || nodosSeleccionados.length === 0) {
                    restaurarTodo();
                    return;
                }

                var nodosVisibles = new Set();
                var aristasVisibles = new Set();

                nodosSeleccionados.forEach(function(id) {
                    nodosVisibles.add(id);
                    network.getConnectedNodes(id).forEach(function(v) { nodosVisibles.add(v); });
                    network.getConnectedEdges(id).forEach(function(e) { aristasVisibles.add(e); });
                });

                var OPACIDAD_FONDO = 0.3;

                var nodeUpdates = allNodes.get().map(function(n) {
                    var c = colorLookup[n.id] || '#97C2FC';
                    var visible = nodosVisibles.has(n.id);
                    var op = visible ? 1.0 : OPACIDAD_FONDO;
                    var col = hexToRgba(c, op);
                    return {
                        id: n.id,
                        color: {
                            background: col,
                            border: col,
                            // Anulamos resaltado de Vis.js con el mismo color calculado
                            highlight: { background: hexToRgba(c, 1.0), border: hexToRgba(c, 1.0) },
                            hover:      { background: hexToRgba(c, 1.0), border: hexToRgba(c, 1.0) }
                        },
                        font: { color: visible ? '#000000' : hexToRgba('#000000', OPACIDAD_FONDO) }
                    };
                });

                var edgeUpdates = allEdges.get().map(function(e) {
                    var c = edgeColorLookup[e.id] || '#848484';
                    var visible = aristasVisibles.has(e.id);
                    var op = visible ? 1.0 : OPACIDAD_FONDO;
                    return {
                        id: e.id,
                        color: {
                            color:     hexToRgba(c, op),
                            highlight: hexToRgba(c, 1.0),
                            hover:     hexToRgba(c, 1.0),
                            inherit: false
                        }
                    };
                });

                allNodes.update(nodeUpdates);
                allEdges.update(edgeUpdates);
            }

            // ─── 7. EVENTOS ────────────────────────────────────────────────────────────

            // Click en nodo(s) o en fondo vacío
            network.on('click', function(params) {
                resaltar(params.nodes); // params.nodes es [] si se hizo click en el fondo
            });

            // Hover (solo actúa si no hay selección persistente activa)
            network.on('hoverNode', function(params) {
                if (network.getSelectedNodes().length === 0) {
                    resaltar([params.node]);
                }
            });

            network.on('blurNode', function() {
                if (network.getSelectedNodes().length === 0) {
                    restaurarTodo();
                }
            });

            // ─── 8. FILTRO ─────────────────────────────────────────────────────────────
            select.addEventListener('change', function(e) {
                filtroActual = e.target.value.toLowerCase();
                nodesView.refresh();
                restaurarTodo(); // limpiamos resaltado al cambiar filtro
            });

        })
        .catch(function(err) {
            console.error("Error cargando el JSON:", err);
            document.getElementById('mynetwork').innerHTML = '<b style="color:red">Error cargando el JSON: ' + err.message + '</b>';
        });

    </script>
</body>
</html>
