<!DOCTYPE html>
<html>
<head>
    <title>Análisis Musical: Red Zorn</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        #mynetwork { width: 100%; height: 85vh; border: 1px solid #ccc; background-color: white; }
        .controls { margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Explorador de Ontología Musical: Catoninetails</h2>
    
    <div class="controls">
        <label>Filtrar por Dimensión: </label>
        <select id="dimensionFilter">
            <option value="all">Mostrar Todo</option>
        </select>
        <small style="margin-left: 20px;">Usa el scroll para Zoom | Arrastra para mover</small>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        var network = null;
        var allNodes = null;
        var allEdges = null;
        var nodesView = null;

        // Cargamos el archivo JSON
        fetch('catoninetails-graph3.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                
                // 1. PRIMERO: Procesamos los nodos y creamos un "Diccionario de Colores"
                var colorLookup = {};
                var nivelLookup = {};

                var processedNodes = data.nodes.map(function(n) {
                    var a = n.attributes || {};
                    var color = a.color || '#97C2FC';
                    var nivel = a.nivel ? String(a.nivel).toLowerCase() : '';
                    
                    // Guardamos en el diccionario para usarlo luego en las aristas
                    colorLookup[n.key] = color;
                    nivelLookup[n.key] = nivel;

                    return {
                        id: n.key,
                        label: a.label || n.key,
                        x: Number(a.x) || 0,
                        y: (Number(a.y) || 0) * -1,
                        color: color,
                        size: Number(a.size) || 10,
                        dimension: a.dimension ? String(a.dimension).toLowerCase() : 'sin dimensión',
                        nivel: nivel
                    };
                });

                // 2. SEGUNDO: Procesamos las aristas con lógica de color inteligente
                var processedEdges = data.edges.map(function(e) {
                    var colorSource = colorLookup[e.source];
                    var colorTarget = colorLookup[e.target];
                    var nivelSource = nivelLookup[e.source];
                    var nivelTarget = nivelLookup[e.target];

                    // LÓGICA: Si uno de los dos es "frase", usamos el color del OTRO nodo
                    // (que será el subtipo o la dimensión).
                    var finalColor = colorSource; // Por defecto el de origen
                    
                    if (nivelSource === 'frase' && nivelTarget !== 'frase') {
                        finalColor = colorTarget;
                    }

                    return {
                        id: e.key,
                        from: e.source,
                        to: e.target,
                        color: { 
                            color: finalColor, 
                            opacity: 0.7 
                        },
                        arrows: { to: { enabled: true, scaleFactor: 1.2 } }
                    };
                });

                // 3. LLENAR EL FILTRO DE DIMENSIONES
                var select = document.getElementById('dimensionFilter');
                var uniqueDims = {};
                processedNodes.forEach(function(n) {
                    if (n.dimension && n.dimension !== 'sin dimensión' && n.nivel !== 'frase') {
                        uniqueDims[n.dimension] = true;
                    }
                });

                Object.keys(uniqueDims).sort().forEach(function(dim) {
                    var opt = document.createElement('option');
                    opt.value = dim;
                    opt.innerHTML = dim.toUpperCase();
                    select.appendChild(opt);
                });

                // 4. CONFIGURAR LA RED
                allNodes = new vis.DataSet(processedNodes);
                allEdges = new vis.DataSet(processedEdges);
                
                // Variable global para guardar el filtro actual
                var filtroActual = 'all';

                // Inicializamos el DataView con la lógica de filtrado
                nodesView = new vis.DataView(allNodes, {
                    filter: function (node) {
                        if (filtroActual === 'all') return true;
                        
                        // REGLA DE ORO: 
                        // Mostramos si coincide la dimensión 
                        // O si el nivel es exactamente "frase"
                        var matchDimension = (node.dimension === filtroActual);
                        var esFrase = (node.nivel === 'frase');
                        
                        return matchDimension || esFrase;
                    }
                });

                var container = document.getElementById('mynetwork');
                var visData = { 
                    nodes: nodesView, 
                    edges: allEdges 
                };

                // (Importante: En las OPTIONS, quita el 'inherit: from' para que use el color manual)
                var options = {
                    nodes: {
                        shape: 'dot',
                        font: { size: 14, strokeWidth: 4, strokeColor: '#ffffff' },
                        borderWidth: 2
                    },
                    edges: {
                        width: 2,
                        smooth: { type: 'continuous' }
                    },
                    physics: { enabled: false },
                    interaction: {
                        hover: true,
                        navigationButtons: true,
                        multiselect: true, // Habilita Ctrl+Click nativo
                        selectConnectedEdges: false // Manejaremos esto manualmente para mejor control
                    }
                };

                network = new vis.Network(container, visData, options);

                // 5. LÓGICA DEL FILTRO ACTUALIZADA
                select.addEventListener('change', function(e) {
                    // Actualizamos la variable global
                    filtroActual = e.target.value.toLowerCase();
                    
                    // IMPORTANTE: Esto obliga al DataView a volver a ejecutar la función filter
                    nodesView.refresh(); 
                });

                // BONUS: Resaltar conexiones al hacer clic
                network.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        var nodeId = params.nodes[0];
                        // Aquí podrías añadir lógica para iluminar vecinos
                        console.log("Nodo seleccionado:", nodeId);
                    }
                });

            })
            .catch(function(err) {
                console.error("Error cargando el JSON:", err);
                document.getElementById('mynetwork').innerHTML = "Error: " + err.message;
            });

        // --- LÓGICA DE RESALTADO ---

        // Función para actualizar el estilo visual basado en la selección o hover
        function actualizarResaltado(nodosActivos) {
            var tieneSeleccion = nodosActivos.length > 0;
        
            // 1. Obtener todos los vecinos de los nodos activos
            var vecinos = new Set();
            var aristasAResaltar = new Set();
        
            nodosActivos.forEach(function(nodeId) {
                vecinos.add(nodeId);
                var conectadas = network.getConnectedNodes(nodeId);
                conectadas.forEach(v => vecinos.add(v));
                
                var edges = network.getConnectedEdges(nodeId);
                edges.forEach(e => aristasAResaltar.add(e));
            });
        
            // 2. Actualizar Nodos
            var actualizacionesNodos = allNodes.get().map(function(node) {
                if (!tieneSeleccion) {
                    return { id: node.id, color: { opacity: 1 }, font: { color: '#000000' } };
                }
                var esVecino = vecinos.has(node.id);
                return {
                    id: node.id,
                    color: { opacity: esVecino ? 1 : 0.1 },
                    font: { color: esVecino ? '#000000' : 'rgba(0,0,0,0.1)' }
                };
            });
            allNodes.update(actualizacionesNodos);
        
            // 3. Actualizar Aristas
            var actualizacionesAristas = allEdges.get().map(function(edge) {
                if (!tieneSeleccion) {
                    return { id: edge.id, color: { opacity: 0.7 } };
                }
                var esRelevante = aristasAResaltar.has(edge.id);
                return {
                    id: edge.id,
                    color: { opacity: esRelevante ? 1 : 0.05 }
                };
            });
            allEdges.update(actualizacionesAristas);
        }
        
        // EVENTO: Hover (pasar el mouse)
        network.on("hoverNode", function (params) {
            // Si no hay nada seleccionado con click, resaltamos el hover
            if (network.getSelectedNodes().length === 0) {
                actualizarResaltado([params.node]);
            }
        });
        
        // EVENTO: Blur (quitar el mouse)
        network.on("blurNode", function (params) {
            if (network.getSelectedNodes().length === 0) {
                actualizarResaltado([]);
            }
        });
        
        // EVENTO: Click y Multi-selección (Ctrl+Click)
        network.on("click", function (params) {
            // params.nodes contiene los IDs de los nodos seleccionados (uno o varios)
            actualizarResaltado(params.nodes);
        });
        
        // EVENTO: Deseleccionar al clickear el fondo
        network.on("deselectNode", function (params) {
            actualizarResaltado(network.getSelectedNodes());
        });
    </script>
</body>
</html>
