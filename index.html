<!DOCTYPE html>
<html>
<head>
    <title>Análisis Musical: Cat O' Nine Tails, John Zorn. Por Nicolás López.</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        #mynetwork { width: 100%; height: 85vh; border: 1px solid #ccc; background-color: white; }
        .controls { margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Explorador de Ontología Musical: Catoninetails</h2>
    
    <div class="controls">
        <label>Filtrar por Dimensión: </label>
        <select id="dimensionFilter">
            <option value="all">Mostrar Todo</option>
        </select>
        <small style="margin-left: 20px;">Usa el scroll para Zoom | Arrastra para mover</small>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        let network = null;
        let allNodes = null;
        let allEdges = null;
        let nodesView = null;

        fetch('catoninetails-graph3.json')
            .then(res => res.json())
            .then(data => {
                
                // 1. CORRECCIÓN DE NODOS
                const processedNodes = data.nodes.map(n => {
                    // Accedemos a n.attributes porque tu JSON lo guarda todo ahí
                    const attrs = n.attributes; 
                    
                    return {
                        id: n.key,  // CRÍTICO: Mapeamos "key" (Gephi) a "id" (Vis.js)
                        label: attrs.label || n.key,
                        
                        // Coordenadas: Las tomamos directamente de attributes
                        x: attrs.x, 
                        y: attrs.y, 
                        
                        color: attrs.color || '#97C2FC',
                        size: attrs.size ? attrs.size : 10,
                        
                        // Guardamos datos extra para el filtro
                        dimension: attrs.dimension || 'Sin Dimensión',
                        nivel: attrs.nivel // Guardamos si es frase, subtipo, etc.
                    };
                });

                // 2. CORRECCIÓN DE ARISTAS (EDGES)
                // Vis.js ignora "source/target", necesita "from/to"
                const processedEdges = data.edges.map(e => ({
                    id: e.key,
                    from: e.source, // CRÍTICO: source -> from
                    to: e.target,   // CRÍTICO: target -> to
                    color: { color: '#848484', opacity: 0.6 } // Color gris suave para las líneas
                }));

                // 3. Llenar el selector
                // Filtramos dimensiones únicas que no sean undefined
                const dimensions = [...new Set(processedNodes.map(n => n.dimension).filter(d => d))];
                const select = document.getElementById('dimensionFilter');
                dimensions.sort().forEach(dim => {
                    // Evitamos agregar la dimension "falsa" de las frases si existe
                    if(dim !== '_Frase_Master') {
                        const opt = document.createElement('option');
                        opt.value = dim;
                        opt.innerHTML = dim.charAt(0).toUpperCase() + dim.slice(1); // Capitalizar
                        select.appendChild(opt);
                    }
                });

                // 4. Inicializar Vis.js
                allNodes = new vis.DataSet(processedNodes);
                allEdges = new vis.DataSet(processedEdges);
                nodesView = new vis.DataView(allNodes);

                const container = document.getElementById('mynetwork');
                const visData = { nodes: nodesView, edges: allEdges };

                const options = {
                    nodes: {
                        shape: 'dot',
                        font: { size: 14, strokeWidth: 4, strokeColor: '#ffffff' } // Borde blanco en texto para legibilidad
                    },
                    edges: {
                        arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                        smooth: { type: 'continuous' } 
                    },
                    physics: {
                        enabled: false // CRÍTICO: Mantiene tus posiciones manuales fijas
                    },
                    interaction: {
                        hover: true,
                        navigationButtons: true,
                        zoomView: true
                    }
                };

                network = new vis.Network(container, visData, options);

                // 5. Lógica del Filtro
                select.addEventListener('change', (e) => {
                    const val = e.target.value;
                    if (val === 'all') {
                        nodesView.setFilter(null);
                    } else {
                        nodesView.setFilter((node) => {
                            // Muestra el nodo si coincide con la dimensión seleccionada
                            // O SI el nivel es "frase" (para mantener el eje central visible siempre)
                            // O SI la dimensión es la master de frases
                            return node.dimension === val || 
                                   node.nivel === 'frase' || 
                                   node.dimension === '_Frase_Master';
                        });
                    }
                });
            })
            .catch(err => {
                console.error("Error completo:", err);
                document.getElementById('mynetwork').innerHTML = "Error: " + err.message;
            });
    </script>
</body>
</html>
